# Security headers for every response. Included at server level in nginx.conf
# and again in each location that sets its own add_header — nginx drops
# inherited add_header directives in any block that defines its own.
#
# No Content-Security-Policy: a policy restrictive enough to help (script-src,
# style-src, connect-src) breaks csc-ui / cookie-consent inline styles and the
# cross-origin DoD calls.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
