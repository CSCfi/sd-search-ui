server {
    listen 8081;
    server_name _;
    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;
    
    # Proxy only frontend API endpoints, stripping `/api` as in Vite.
    # Reject all other API paths; keep this list in sync with `src/services/api.ts`.
    # `rewrite` is required because regex locations cannot use a URI in `proxy_pass`.
    location ~ ^/api/(filtering_terms|filtering_scopes|datasets|images|status)(/|$) {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass ${BACKEND_URL};
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
    }

    # LLM-backed endpoint: the backend sets no run timeout and the client aborts at 75 s,
    # so nginx must wait longer than its 60 s default.
    location = /api/ai/filters {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass ${BACKEND_URL};
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 80s;
    }

    location /api/ {
        return 404;
    }

    # The OIDC login/callback/logout endpoints must also be reached through
    # this origin, not the backend's own hostname directly — the session
    # cookie the backend sets on /callback is host-only, so it only reaches
    # later /api/ calls if /callback itself was also requested through this
    # same origin.
    location = /login {
            proxy_pass ${BACKEND_URL}/login;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
    }

    location = /callback {
            proxy_pass ${BACKEND_URL}/callback;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
    }

    location = /logout {
            proxy_pass ${BACKEND_URL}/logout;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
    }

    # Without this, direct navigation to e.g. /search returns 404 — Vue
    # Router handles routing client-side, there's no physical /search file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite — safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # index.html itself must never be cached, or deploys won't take effect
    # for users with a previously cached index.html.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
