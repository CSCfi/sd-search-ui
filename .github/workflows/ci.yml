name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [ bigpicture ]
        
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint:ci

      - name: Format check
        run: pnpm format:ci

      - name: Test
        run: pnpm test:unit -- --run

      - name: Build
        run: VITE_SERVICE=${{ matrix.service }} pnpm build

  rahti-image-stream:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [ bigpicture ]
        
    steps:
      - uses: actions/checkout@v7

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Rahti Registry
        run: echo "${{ secrets.RAHTI_TOKEN }}" | docker login -u unused --password-stdin ${{ secrets.RAHTI_REGISTRY }}

      - name: Build and Tag Image
        run: |
          docker build -f docker/Dockerfile --build-arg VITE_SERVICE=${{ matrix.service }} --build-arg VITE_REMS_URL=${{ secrets.VITE_REMS_URL }} --build-arg VITE_DOD_ENDPOINT_URL=${{ secrets.VITE_DOD_ENDPOINT_URL }} -t ${{ secrets.RAHTI_REGISTRY }}/${{ secrets.RAHTI_PROJECT }}/sd-search-ui-${{ matrix.service }}:latest .

      - name: Push Image
        run: |
          docker push ${{ secrets.RAHTI_REGISTRY }}/${{ secrets.RAHTI_PROJECT }}/sd-search-ui-${{ matrix.service }}:latest